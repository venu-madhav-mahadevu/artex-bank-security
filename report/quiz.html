<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARTEX: Test Yourself</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0f16;--bg2:#0e1420;--panel:#121a28;--panel2:#17212f;--line:#223044;--line2:#2d4056;--ink:#e8eef6;--mut:#9fb2c8;--dim:#6f8299;--cyan:#35d0c0;--cyan-dim:#1d7a72;--green:#4cc38a;--red:#e65c5c;--amber:#f0a83a}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1000px 520px at 85% -10%,rgba(53,208,192,.10),transparent 60%),var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px 70px}
  a{color:var(--cyan)}
  header{padding:46px 0 24px}
  .tag{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);border:1px solid var(--cyan-dim);background:rgba(53,208,192,.07);padding:6px 12px;border-radius:999px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan)}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(28px,5vw,42px);margin:16px 0 10px;letter-spacing:-.02em}
  h1 .accent{background:linear-gradient(90deg,var(--cyan),#4a9eff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{font-size:16px;color:var(--mut);max-width:600px}
  .nav{margin-top:16px;font-size:14px}
  .nav a{text-decoration:none;border:1px solid var(--line2);padding:7px 14px;border-radius:999px;margin-right:8px;display:inline-block}
  .bar{display:flex;align-items:center;gap:12px;margin:10px 0 18px}
  .track{flex:1;height:8px;background:#0c121c;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
  .trackfill{height:100%;width:0;background:var(--cyan);transition:width .3s}
  .count{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--dim)}
  .q{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:22px}
  .qnum{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--cyan)}
  .qtext{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;margin:6px 0 16px;line-height:1.35}
  .opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:inherit;font-size:15px;padding:13px 15px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--line2)}
  .opt:disabled{cursor:default}
  .opt.correct{border-color:var(--green);background:rgba(76,195,138,.12)}
  .opt.wrong{border-color:var(--red);background:rgba(230,92,92,.10)}
  .exp{margin-top:6px;font-size:14px;color:var(--mut);border-left:3px solid var(--cyan-dim);padding:10px 14px;background:rgba(53,208,192,.05);border-radius:0 8px 8px 0;display:none}
  .exp.show{display:block}
  .exp b{color:var(--ink)}
  .next{margin-top:16px;background:var(--cyan);color:#06202b;border:none;border-radius:10px;font-weight:600;font-size:15px;padding:11px 20px;cursor:pointer;font-family:inherit;display:none}
  .next.show{display:inline-block}
  .result{text-align:center;padding:40px 0}
  .score{font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:700;color:var(--cyan)}
  .verdict{font-size:18px;margin:8px 0 4px}
  .retry{margin-top:20px;background:none;border:1px solid var(--line2);color:var(--mut);border-radius:10px;font-size:14px;padding:10px 18px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="tag"><span class="dot"></span> Test Yourself</span>
    <h1>Do you know how to <span class="accent">stop ARTEX?</span></h1>
    <p class="lede">8 quick questions on the attacks and their fixes. Instant feedback and a short reason after each.</p>
    <div class="nav"><a href="index.html">Report</a><a href="examples.html">Attacks</a><a href="fixes.html">Fixes</a></div>
  </header>

  <div class="bar"><div class="track"><div class="trackfill" id="progress"></div></div><span class="count" id="count"></span></div>

  <div id="quiz"></div>
</div>

<script>
const Q = [
 {q:"ARTEX's documented bank attacks mostly relied on…", o:[
   "Brand-new zero-day vulnerabilities",
   "Known, preventable weaknesses chained at machine speed",
   "Insider employees leaking data",
   "Physical break-ins at branches"], a:1,
   e:"No source reported a zero-day. ARTEX chained known weaknesses (weak logins, SQLi, leaked secrets) at machine speed — speed and scale were what changed."},
 {q:"The best defense against credential spraying is…", o:[
   "A longer password policy only",
   "Hiding the login page",
   "Rate limiting + burst lockout + phishing-resistant MFA",
   "Blocking one country's IPs"], a:2,
   e:"Throttle attempts per account/IP, lock out on bursts (not human pace), and require passkeys/MFA — a stolen password alone shouldn't be enough."},
 {q:"SQL injection is reliably prevented by…", o:[
   "Hiding database errors",
   "Parameterised queries (never concatenating input)",
   "A longer admin password",
   "Renaming the database tables"], a:1,
   e:"Bound parameters keep user input as data, never as part of the SQL command, so it can't rewrite the query."},
 {q:"An API that checks you're logged in but not whether the record is yours has…", o:[
   "An IDOR flaw — fix with per-request ownership checks",
   "A rate-limit flaw",
   "A deepfake flaw",
   "No flaw at all"], a:0,
   e:"IDOR = broken object-level authorization. Verify the caller owns the object on every request, and return 404 if not."},
 {q:"SSRF becomes critical because an agent can reach…", o:[
   "The company cafeteria menu",
   "The cloud metadata service and steal instance credentials",
   "The user's screen brightness",
   "Nothing of value"], a:1,
   e:"A fetch pointed at 169.254.169.254 can hand over cloud credentials. Fix: allow-list outbound hosts, block internal ranges, require IMDSv2."},
 {q:"API keys found in a public GitHub repo should be…", o:[
   "Left alone if the repo looks small",
   "Renamed",
   "Rotated immediately and moved to a vault",
   "Emailed to the team"], a:2,
   e:"Treat any exposed key as compromised: rotate it now, store secrets in a vault, and scan every commit so it never happens again."},
 {q:"Payment-API abuse (skipping KYC/limit checks) is stopped by…", o:[
   "A faster server",
   "A server-side state machine + maker-checker approval",
   "A nicer UI",
   "Emailing receipts"], a:1,
   e:"Enforce the sequence (creation → KYC → sanction → beneficiary → limits) in the API itself, and require two-person approval for fund movement."},
 {q:"Why is ARTEX dangerous even with no new vulnerabilities?", o:[
   "It invents its own exploits",
   "It only works on weekends",
   "Speed, scale and a lower skill floor — it chains known bugs autonomously",
   "It needs no internet"], a:2,
   e:"It runs familiar attacker playbooks in parallel at machine speed with little supervision, so the same old bugs get exploited far faster and by less-skilled operators."},
];

let i=0, score=0, answered=false;
const quiz=document.getElementById('quiz');
const prog=document.getElementById('progress');
const count=document.getElementById('count');

function render(){
  answered=false;
  const item=Q[i];
  prog.style.width=((i)/Q.length*100)+'%';
  count.textContent=(i+1)+' / '+Q.length;
  quiz.innerHTML='';
  const card=document.createElement('div'); card.className='q';
  card.innerHTML='<div class="qnum">Question '+(i+1)+'</div><div class="qtext">'+item.q+'</div>';
  item.o.forEach((opt,idx)=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=opt;
    b.onclick=()=>choose(idx,card,item);
    card.appendChild(b);
  });
  const exp=document.createElement('div'); exp.className='exp'; exp.id='exp';
  card.appendChild(exp);
  const nx=document.createElement('button'); nx.className='next'; nx.id='next';
  nx.textContent = (i===Q.length-1)?'See results':'Next question';
  nx.onclick=()=>{ i++; (i<Q.length)?render():results(); };
  card.appendChild(nx);
  quiz.appendChild(card);
}

function choose(idx,card,item){
  if(answered) return; answered=true;
  const opts=card.querySelectorAll('.opt');
  opts.forEach((o,k)=>{ o.disabled=true; if(k===item.a)o.classList.add('correct'); });
  if(idx===item.a){ score++; }
  else { opts[idx].classList.add('wrong'); }
  const exp=document.getElementById('exp');
  exp.innerHTML='<b>'+(idx===item.a?'Correct. ':'Not quite. ')+'</b>'+item.e;
  exp.classList.add('show');
  document.getElementById('next').classList.add('show');
  prog.style.width=((i+1)/Q.length*100)+'%';
}

function results(){
  const pct=Math.round(score/Q.length*100);
  let v = pct===100?'Perfect — you could brief the security team.':pct>=75?'Strong — you’ve got the core defenses down.':pct>=50?'Decent start — review the fixes and try again.':'Worth another look at the report, then retry.';
  try{ if(window.vbLogFeedback){} }catch(e){}
  quiz.innerHTML='<div class="result"><div class="score">'+score+'/'+Q.length+'</div><div class="verdict">'+v+'</div><div class="count">'+pct+'% correct</div><button class="retry" onclick="restart()">Try again</button><div style="margin-top:18px"><a href="fixes.html">Review the fixes &rarr;</a></div></div>';
  prog.style.width='100%'; count.textContent='Done';
}
function restart(){ i=0; score=0; render(); }
render();
</script>
<div id="fb-count" style="position:fixed;left:16px;bottom:16px;z-index:9997;display:none;font-family:'JetBrains Mono',monospace;font-size:12px;color:#9fb2c8;background:#0e1420;border:1px solid #223044;border-radius:999px;padding:6px 12px">Site visits: …</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, runTransaction, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { firebaseConfig } from "./firebase-config.js";
  let analytics=null;
  if (firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("PASTE") === -1) {
    const app = initializeApp(firebaseConfig);
    const fdb = getFirestore(app);
    window.vbLogAsk = function(q){ try{ addDoc(collection(fdb,"asks"),{ q:String(q).slice(0,500), page:location.pathname, ts:serverTimestamp() }); }catch(e){} };
    window.vbLogFeedback = function(h,q){ try{ addDoc(collection(fdb,"feedback"),{ helpful:!!h, q:String(q||"").slice(0,500), page:location.pathname, ts:serverTimestamp() }); }catch(e){} };
    const vbVid=(function(){try{var k="vb_vid",v=localStorage.getItem(k);if(!v){v="v"+Math.random().toString(36).slice(2,8);localStorage.setItem(k,v);}return v;}catch(e){return "v?";}})();
    window.vbGreeting = function(name,liked,msg){ try{ addDoc(collection(fdb,"feedback"),{ kind:"intro", name:String(name||"").slice(0,80), liked:(liked===null?null:!!liked), msg:String(msg||"").slice(0,1000), visitorId:vbVid, page:location.pathname, ts:serverTimestamp() }); }catch(e){} };
    function vbDevice(){var ua=navigator.userAgent,o='Other',b='Other';if(/Windows/.test(ua))o='Windows';else if(/Mac OS X|Macintosh/.test(ua))o='macOS';else if(/Android/.test(ua))o='Android';else if(/iPhone|iPad|iPod/.test(ua))o='iOS';else if(/Linux/.test(ua))o='Linux';if(/Edg\//.test(ua))b='Edge';else if(/OPR\/|Opera/.test(ua))b='Opera';else if(/Chrome\//.test(ua))b='Chrome';else if(/Firefox\//.test(ua))b='Firefox';else if(/Safari\//.test(ua))b='Safari';var dv=/Mobi|Android|iPhone|iPod/.test(ua)?'Mobile':(/iPad|Tablet/.test(ua)?'Tablet':'Desktop');return{os:o,browser:b,device:dv,screen:screen.width+'x'+screen.height,lang:navigator.language||'',tz:(Intl.DateTimeFormat().resolvedOptions().timeZone)||'',ref:document.referrer||'direct'};}
    try{ addDoc(collection(fdb,"visits"), Object.assign({page:location.pathname, ts:serverTimestamp(), visitorId:vbVid}, vbDevice())); }catch(e){}
    try {
      const { getAnalytics, logEvent } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js");
      analytics = getAnalytics(app);
      logEvent(analytics, "page_view", { page_path: location.pathname });
    } catch (e) {}
    try {
      const db = getFirestore(app);
      const ref = doc(db, "stats", "visits");
      const n = await runTransaction(db, async (tx) => {
        const s = await tx.get(ref);
        const c = (s.exists() ? (s.data().count || 0) : 0) + 1;
        tx.set(ref, { count: c });
        return c;
      });
      const el = document.getElementById("fb-count");
      el.textContent = "Site visits: " + n;
      el.style.display = "block";
    } catch (e) {}
  }
</script>
<style>
#vbIntro{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);z-index:99999;max-width:340px;width:calc(100% - 32px);background:#121a28;border:1px solid #2d4056;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.5);padding:16px 16px 14px;opacity:0;transition:opacity .6s ease,transform .6s ease;font-family:'Inter',system-ui,sans-serif;color:#e8eef6}
#vbIntro.show{opacity:1;transform:translate(-50%,0)}
#vbIntro h4{margin:0 0 4px;font-family:'Space Grotesk',sans-serif;font-size:15px}
#vbIntro p{margin:0 0 10px;font-size:12.5px;color:#9fb2c8}
#vbIntro input{width:100%;background:#0b1119;border:1px solid #2d4056;border-radius:9px;color:#e8eef6;font-size:13px;padding:9px 11px;margin-bottom:10px}
#vbIntro input:focus{outline:none;border-color:#35d0c0}
#vbIntro textarea{width:100%;background:#0b1119;border:1px solid #2d4056;border-radius:9px;color:#e8eef6;font-size:13px;padding:9px 11px;margin-bottom:10px;resize:vertical;font-family:inherit;line-height:1.4}
#vbIntro textarea:focus{outline:none;border-color:#35d0c0}
#vbIntro .lk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#9fb2c8;margin-bottom:12px;flex-wrap:wrap}
#vbIntro .lk button{cursor:pointer;background:transparent;border:1px solid #2d4056;border-radius:8px;font-size:15px;padding:3px 10px;color:#e8eef6}
#vbIntro .lk button.on{border-color:#35d0c0;background:rgba(53,208,192,.14)}
#vbIntro .row{display:flex;gap:8px}
#vbIntro .row button{flex:1;cursor:pointer;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:12.5px;padding:9px}
#vbIntro .sub{background:#35d0c0;color:#06221f;border:1px solid #35d0c0;font-weight:600}
#vbIntro .skip{background:transparent;color:#9fb2c8;border:1px solid #2d4056}
#vbIntro .x{position:absolute;top:9px;right:12px;cursor:pointer;color:#6f8299;font-size:17px;line-height:1}
#vbFab{position:fixed;top:14px;right:16px;z-index:99998;width:46px;height:46px;border-radius:50%;background:#121a28;border:1px solid #2d4056;color:#35d0c0;font-size:20px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:0}
#vbFab:hover{border-color:#35d0c0;background:rgba(53,208,192,.12)}
@media (max-width:640px){#vbIntro{bottom:auto;top:12px;max-height:82vh;overflow-y:auto}}
</style>
<div id="vbIntro" role="dialog" aria-label="Quick hello">
  <span class="x" id="vbIX">&times;</span>
  <h4>&#128075; Quick hello</h4>
  <p>Mind sharing your name and any feedback? All optional &mdash; you can skip.</p>
  <input id="vbIName" type="text" placeholder="Your name (optional)" maxlength="80" autocomplete="off">
  <div class="lk">Do you like this information?
    <button type="button" id="vbIY">&#128077;</button>
    <button type="button" id="vbIN">&#128078;</button>
  </div>
  <textarea id="vbIMsg" rows="2" placeholder="Feedback, or ask for more info (optional)" maxlength="1000"></textarea>
  <div class="row">
    <button class="sub" id="vbISub">Submit</button>
    <button class="skip" id="vbISkip">No thanks</button>
  </div>
</div>
<script>
(function(){
  var box=document.getElementById('vbIntro'); if(!box) return;
  var TEMPLATE=box.innerHTML;
  var CK='vb_intro_count', TK='vb_intro_last', MAX=2, INTERVAL=120000;
  function readN(k){ try{ return parseInt(localStorage.getItem(k)||'0',10)||0; }catch(e){ return 0; } }
  function bump(){ try{ localStorage.setItem(CK,String(readN(CK)+1)); localStorage.setItem(TK,String(Date.now())); }catch(e){} }
  function close(){ box.classList.remove('show'); setTimeout(function(){ box.style.display='none'; },600); }
  function bind(){
    var liked=null, yb=box.querySelector('#vbIY'), nb=box.querySelector('#vbIN');
    function setLike(v){ liked=v; yb.classList.toggle('on',v===1); nb.classList.toggle('on',v===0); }
    yb.onclick=function(){ setLike(liked===1?null:1); };
    nb.onclick=function(){ setLike(liked===0?null:0); };
    box.querySelector('#vbISub').onclick=function(){
      var nm=(box.querySelector('#vbIName').value||'').trim();
      var mg=(box.querySelector('#vbIMsg').value||'').trim();
      try{ window.vbGreeting && window.vbGreeting(nm, liked===null?null:(liked===1), mg); }catch(e){}
      box.querySelector('h4').innerHTML='Thank you! &#128591;';
      box.querySelector('p').textContent='Appreciate it.';
      box.querySelector('#vbIName').style.display='none';
      box.querySelector('#vbIMsg').style.display='none';
      box.querySelector('.lk').style.display='none';
      box.querySelector('.row').style.display='none';
      setTimeout(close,900);
    };
    box.querySelector('#vbISkip').onclick=close;
    box.querySelector('#vbIX').onclick=close;
  }
  function open(){ box.innerHTML=TEMPLATE; bind(); box.style.display=''; requestAnimationFrame(function(){ box.classList.add('show'); }); }
  var fab=document.createElement('button');
  fab.id='vbFab'; fab.type='button'; fab.title='Send feedback'; fab.setAttribute('aria-label','Send feedback'); fab.innerHTML='💬';
  fab.onclick=open;
  document.body.appendChild(fab);
  (function(){
    var cnt=readN(CK), last=readN(TK);
    if(cnt>=MAX) return;
    if(cnt>0 && (Date.now()-last)<INTERVAL) return;
    setTimeout(function(){ open(); bump(); },2500);
  })();
})();
</script>
</body>
</html>
